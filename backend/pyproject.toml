[project]
name = "acide-watch"
version = "2.0.0"
description = "Self-hosted job portal and automated career-scouting engine"
requires-python = ">=3.11"
dynamic = ["dependencies"]

# `pip install -e backend/` puts `acide` on the interpreter's path
# permanently, so `acide` / `python -m acide` work from any directory —
# not just from inside backend/. Without this table, `pip install -e .`
# silently has nothing to build against.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
acide = "acide.__main__:main"

[tool.setuptools.dynamic]
# Single source of truth for runtime deps — requirements.txt, not a
# second copy pasted into this file.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["acide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:acide.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI dependency defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
# The digest template is inline-styled HTML for mail clients; wrapping the
# style attributes would make it less readable, not more.
"acide/mailer.py" = ["E501"]
"acide/api/alerts.py" = ["E501"]  # inline-styled unsubscribe page
# Test fixtures embed realistic API payloads verbatim.
"tests/*" = ["E501"]
